name = "stagepilot-beta-control-plane"
main = "src/index.ts"
compatibility_date = "2026-09-12"

[durable_objects]
bindings = [
  { name = "REGISTRY", class_name = "Registry" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

# R2 bucket for installation-uploaded diagnostic bundles (see
# POST /v1/installations/:id/diagnostics in src/index.ts). Optional/deferred
# the same way GITHUB_RELEASE_TOKEN is: if the deploying CLOUDFLARE_API_TOKEN
# lacks R2 permissions, this binding and the bucket provisioning step can be
# skipped and the diagnostics routes will respond 503 instead of failing
# deploy. The bucket must be created once out-of-band (e.g.
# `wrangler r2 bucket create stagepilot-beta-diagnostics`) before this
# binding resolves; wrangler deploy does not auto-create R2 buckets.
[[r2_buckets]]
binding = "DIAGNOSTICS"
bucket_name = "stagepilot-beta-diagnostics"

# Auto-expire uploaded bundles after 30 days (see DIAGNOSTICS_RETENTION_DAYS
# in src/index.ts). Configured on the bucket itself via a lifecycle rule;
# wrangler does not manage R2 lifecycle rules, so this must also be applied
# out-of-band, e.g.:
#   wrangler r2 bucket lifecycle add stagepilot-beta-diagnostics \
#     --name expire-diagnostics --expire-days 30 --prefix diagnostics/

# The protected manual deployment workflow supplies CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_ZONE_ID, REMOTE_HOST_SUFFIX, and REMOTE_PORT as deployment vars.
# BETA_RELEASE_VERSIONS and BETA_LATEST_RELEASE_VERSION are also deployment
# vars, as is the optional ENROLLMENT_EXEMPT_SOURCES developer-network
# enrollment-quota exemption list (comma-separated normalized sources; empty
# or unset exempts nobody).
#
# ENROLLMENT_WINDOW_SECONDS is the anonymous-enrollment quota window (seconds)
# for ENROLLMENTS_PER_SOURCE; defaults to 86400 (24h) when unset.
# TEMPORARY OPERATOR-TESTING CONFIGURATION: currently deployed as 3600 (1h)
# for the active beta test period so the operator does not have to wait ~24h
# between exhausted-quota test cycles. MUST be reverted to 86400 (or longer)
# before this beta is promoted to stable or opened to real friend-beta users.
# It installs and reads back the names of these
# Worker secrets:
# CLOUDFLARE_API_TOKEN, ADMIN_API_TOKEN, INSTALLATION_SIGNING_KEY,
# GITHUB_RELEASE_TOKEN.
# Do not add deployment-specific placeholders or secret values to this file.

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[build]
command = "npm run build"
