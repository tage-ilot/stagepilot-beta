name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Python 3.12
    runs-on: [self-hosted, stagepilot-linux]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          working-directory: backend

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --frozen pytest

      - name: Run lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Run type checking
        run: uv run --frozen mypy

  frontend:
    name: Frontend — Node 22
    runs-on: [self-hosted, stagepilot-linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run lint
        run: npm --prefix frontend run lint

      - name: Run tests
        run: npm --prefix frontend test

      - name: Run type checking
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

  multitracks-cues:
    name: MultiTracks cues — Node 22
    runs-on: [self-hosted, stagepilot-linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/multitracks-cues/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix tools/multitracks-cues

      - name: Run tests
        run: npm --prefix tools/multitracks-cues test -- --run

      - name: Run lint
        run: npm --prefix tools/multitracks-cues run lint

      - name: Run type checking
        run: npm --prefix tools/multitracks-cues run typecheck

      - name: Build CLI package
        run: npm --prefix tools/multitracks-cues run build

  desktop-linux-checks:
    name: Desktop shell checks — Linux
    runs-on: [self-hosted, stagepilot-linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend and desktop dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Validate workflow runner policy with parsed YAML
        run: uv run --with PyYAML==6.0.3 python scripts/validate_workflow_runners.py

      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Compile-check desktop shell on Linux
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run Linux-compatible desktop tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build native Linux desktop shell for window constraint proof
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml

      - name: Upload native Linux desktop shell for window constraint proof
        uses: actions/upload-artifact@v4
        with:
          name: stagepilot-linux-window-proof
          path: desktop/src-tauri/target/debug/stagepilot-desktop
          if-no-files-found: error

      - name: Validate updater and release configuration
        run: npm --prefix desktop run release:test

  updater-chain:
    name: Updater chain — Linux-provable
    runs-on: [self-hosted, stagepilot-linux]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install locked control-plane dependencies
        run: npm ci --prefix control-plane

      - name: Type-check the control plane
        run: npm --prefix control-plane run build

      - name: Prove release-broker allowlisting, caching, and abuse limits
        run: npm --prefix control-plane test

      - name: Prove manifest generation, validation, and channel isolation
        run: npm --prefix desktop run release:test

      - name: Prove updater manifest negative cases end to end
        run: node scripts/updater_chain_proof.mjs

  desktop:
    name: Desktop installer — Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          working-directory: backend

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend and desktop dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Run packaged Remote lifecycle on Windows
        run: |
          uv sync --project backend --locked --extra dev
          uv run --project backend --frozen pytest backend/tests/test_remote_bootstrap.py backend/tests/test_remote_feature.py

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Compile-check desktop shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run desktop lifecycle tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Validate updater and release configuration
        run: npm --prefix desktop run release:test

      - name: Build packaged application and installer
        run: npm --prefix desktop run build:ci

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: stagepilot-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  desktop-macos-lifecycle:
    name: Desktop lifecycle — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
          - name: macOS Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run build

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          working-directory: backend

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Stage packaged desktop runtime
        run: npm --prefix desktop run build:runtime

      - name: Generate macOS Help Book
        run: npm --prefix desktop run build:help

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check

      - name: Compile-check macOS desktop shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Run macOS desktop lifecycle tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
