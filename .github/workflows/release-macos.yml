name: Release StagePilot

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.1.41
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: [self-hosted, stagepilot-linux]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Require updater signing secrets
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured."; exit 1; }
          test -n "$PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured."; exit 1; }
      - name: Validate versions, stable identity, endpoint, and public key
        env:
          STAGEPILOT_TRACKED_FILES: ${{ join(github.event.commits.*.added, '\n') }}
        run: node scripts/validate_versions.mjs "$RELEASE_TAG"
      - name: Verify exact tagged source and release export
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "::error::Checked-out source does not match $RELEASE_TAG."
            exit 1
          }
          node scripts/audit_beta_release.mjs source
      - name: Reject tracked private keys
        run: |
          if git ls-files | grep -E '\.(key|pem)$'; then
            echo "::error::Private key-like files must never be tracked."
            exit 1
          fi

  build:
    name: Build — ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: darwin-aarch64
            suffix: aarch64
            command: build:mac
          - name: macOS Intel
            runner: macos-15-intel
            platform: darwin-x86_64
            suffix: x64
            command: build:mac
          - name: Windows x64
            runner: windows-latest
            platform: windows-x86_64
            suffix: x64
            command: build
    runs-on: ${{ matrix.runner }}
    environment: stagepilot-control-plane
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
          python-version: "3.12"
          working-directory: backend
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install dependencies
        shell: bash
        run: |
          uv sync --project backend --extra dev --locked
          npm ci --prefix frontend
          npm ci --prefix desktop
          rustup update stable
          rustup default stable
      - name: Generate macOS Help Book
        if: runner.os == 'macOS'
        run: npm --prefix desktop run build:help
      - name: Validate application
        shell: bash
        run: |
          uv run --project backend ruff format --check backend/src backend/tests
          uv run --project backend ruff check backend/src backend/tests
          uv run --project backend python -m mypy --config-file backend/pyproject.toml backend/src backend/tests
          uv run --project backend python -m pytest -c backend/pyproject.toml backend/tests
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend test -- --run
          npm --prefix frontend run build
          npm --prefix desktop run build:runtime
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          npm --prefix desktop run release:test
      - name: Test macOS uninstaller script
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test_macos_uninstaller.sh
      - name: Verify Planning Center OAuth client ID is resolved
        shell: bash
        env:
          STAGEPILOT_PCO_CLIENT_ID: ${{ secrets.PLANNING_CENTER_CLIENT_ID }}
        run: |
          echo "Planning Center OAuth client_id length: ${#STAGEPILOT_PCO_CLIENT_ID}"
          test -n "$STAGEPILOT_PCO_CLIENT_ID" || {
            echo "::error::PLANNING_CENTER_CLIENT_ID resolved empty; refusing to build a broken release."
            exit 1
          }
      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          STAGEPILOT_PCO_CLIENT_ID: ${{ secrets.PLANNING_CENTER_CLIENT_ID }}
          STAGEPILOT_RELEASE_BUILD: "1"
        run: npm --prefix desktop run ${{ matrix.command }}
      - name: Verify final macOS application, DMG, and updater archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "darwin-aarch64" ]]; then
            EXPECTED_ARCH="arm64"
          else
            EXPECTED_ARCH="x86_64"
          fi
          APP="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ARCHIVE="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -s "$ARCHIVE.sig"
          bash scripts/verify_macos_release_bundle.sh --app "$APP" --arch "$EXPECTED_ARCH"
          bash scripts/verify_macos_release_bundle.sh --dmg "$DMG" --arch "$EXPECTED_ARCH"
          bash scripts/verify_macos_release_bundle.sh --archive "$ARCHIVE" --arch "$EXPECTED_ARCH"
      - name: Collect macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg "release-assets/StagePilot_${VERSION}_${{ matrix.suffix }}.dmg"
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz "release-assets/StagePilot_${VERSION}_${{ matrix.suffix }}.app.tar.gz"
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig "release-assets/StagePilot_${VERSION}_${{ matrix.suffix }}.app.tar.gz.sig"
      - name: Collect Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS updater installer was not generated." }
          Copy-Item $installer.FullName "release-assets/StagePilot_${version}_x64-setup.exe"
          Copy-Item "$($installer.FullName).sig" "release-assets/StagePilot_${version}_x64-setup.exe.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: stagepilot-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release and updater manifest
    needs: build
    runs-on: [self-hosted, stagepilot-linux]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: stagepilot-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        run: |
          {
            echo "StagePilot ${RELEASE_TAG#v}"
            echo
            git log -1 --pretty=%B
          } > release-assets/release-notes.md
      - name: Generate and validate latest.json
        env:
          BETA_DOWNLOAD_BASE: https://github.com/tage-ilot/stagepilot-beta/releases/download
        run: |
          node scripts/generate_updater_manifest.mjs release-assets "$RELEASE_TAG" "$BETA_DOWNLOAD_BASE"
          node scripts/validate_updater_manifest.mjs release-assets/latest.json release-assets "$BETA_DOWNLOAD_BASE"
          node scripts/audit_beta_release.mjs assets release-assets "${RELEASE_TAG#v}"
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish_release.mjs "$RELEASE_TAG" release-assets
