name: Deploy Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, stagepilot-linux]
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: [self-hosted, stagepilot-linux]
    environment: stagepilot-control-plane
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      REMOTE_HOST_SUFFIX: ${{ vars.REMOTE_HOST_SUFFIX }}
      REMOTE_PORT: ${{ vars.REMOTE_PORT }}
      ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
      BETA_INSTALLATION_LIMIT: ${{ vars.BETA_INSTALLATION_LIMIT }}
      BETA_RELEASE_VERSIONS: ${{ vars.BETA_RELEASE_VERSIONS }}
      BETA_LATEST_RELEASE_VERSION: ${{ vars.BETA_LATEST_RELEASE_VERSION }}
      ENROLLMENT_EXEMPT_SOURCES: ${{ vars.ENROLLMENT_EXEMPT_SOURCES }}
      ENROLLMENT_WINDOW_SECONDS: ${{ vars.ENROLLMENT_WINDOW_SECONDS }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
      INSTALLATION_SIGNING_KEY: ${{ secrets.INSTALLATION_SIGNING_KEY }}
      PLANNING_CENTER_CLIENT_ID: ${{ secrets.PLANNING_CENTER_CLIENT_ID }}
      PLANNING_CENTER_CLIENT_SECRET: ${{ secrets.PLANNING_CENTER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci --prefix control-plane
      - name: Validate protected deployment configuration
        run: node control-plane/scripts/deployment-config.mjs validate
      - name: Build a deployment preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: >-
            deploy --dry-run
            --var CLOUDFLARE_ACCOUNT_ID:${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            --var CLOUDFLARE_ZONE_ID:${{ vars.CLOUDFLARE_ZONE_ID }}
            --var REMOTE_HOST_SUFFIX:${{ vars.REMOTE_HOST_SUFFIX }}
            --var REMOTE_PORT:${{ vars.REMOTE_PORT }}
            --var ENROLLMENT_ENABLED:${{ vars.ENROLLMENT_ENABLED }}
            --var BETA_INSTALLATION_LIMIT:${{ vars.BETA_INSTALLATION_LIMIT }}
            --var BETA_RELEASE_VERSIONS:${{ vars.BETA_RELEASE_VERSIONS }}
            --var BETA_LATEST_RELEASE_VERSION:${{ vars.BETA_LATEST_RELEASE_VERSION }}
            --var ENROLLMENT_EXEMPT_SOURCES:${{ vars.ENROLLMENT_EXEMPT_SOURCES }}
            --var ENROLLMENT_WINDOW_SECONDS:${{ vars.ENROLLMENT_WINDOW_SECONDS }}
      - name: Deploy and install Worker runtime secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: >-
            deploy
            --var CLOUDFLARE_ACCOUNT_ID:${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            --var CLOUDFLARE_ZONE_ID:${{ vars.CLOUDFLARE_ZONE_ID }}
            --var REMOTE_HOST_SUFFIX:${{ vars.REMOTE_HOST_SUFFIX }}
            --var REMOTE_PORT:${{ vars.REMOTE_PORT }}
            --var ENROLLMENT_ENABLED:${{ vars.ENROLLMENT_ENABLED }}
            --var BETA_INSTALLATION_LIMIT:${{ vars.BETA_INSTALLATION_LIMIT }}
            --var BETA_RELEASE_VERSIONS:${{ vars.BETA_RELEASE_VERSIONS }}
            --var BETA_LATEST_RELEASE_VERSION:${{ vars.BETA_LATEST_RELEASE_VERSION }}
            --var ENROLLMENT_EXEMPT_SOURCES:${{ vars.ENROLLMENT_EXEMPT_SOURCES }}
            --var ENROLLMENT_WINDOW_SECONDS:${{ vars.ENROLLMENT_WINDOW_SECONDS }}
          secrets: |
            CLOUDFLARE_API_TOKEN
            ADMIN_API_TOKEN
            INSTALLATION_SIGNING_KEY
            PLANNING_CENTER_CLIENT_ID
            PLANNING_CENTER_CLIENT_SECRET
      - name: Read back Worker runtime secret names
        id: runtime-secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: control-plane
          command: secret list --format json
      - name: Verify every Worker runtime secret is installed
        env:
          WRANGLER_SECRET_LIST: ${{ steps.runtime-secrets.outputs.command-output }}
        run: node control-plane/scripts/deployment-config.mjs verify-secrets
